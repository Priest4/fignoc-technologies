name: Build production branch

# cPanel has no Node toolchain worth relying on, and @vite() needs
# public/build/manifest.json at runtime. So: main stays clean (public/build is
# gitignored), and every push to main is rebuilt here and published to the
# `production` branch with the compiled assets committed.
#
# cPanel Git Version Control tracks `production` and only ever fast-forwards:
# each new commit here is parented on the previous production tip, so "Update
# from Remote" never hits a non-fast-forward.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-production-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Verify the manifest exists
        run: test -f public/build/manifest.json

      - name: Publish tree + assets to the production branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # The index currently matches main's tree; force-add the ignored build
          # output so the written tree is "main plus compiled assets".
          git add --force public/build
          tree="$(git write-tree)"

          msg="Deploy build for $(git log -1 --pretty=%h main) - $(git log -1 --pretty=%s main)"

          if git fetch --no-tags origin production 2>/dev/null; then
            prev="$(git rev-parse FETCH_HEAD)"
            if [ "$(git rev-parse "$prev^{tree}")" = "$tree" ]; then
              echo "production is already up to date with this tree; nothing to push."
              exit 0
            fi
            # Two parents: the previous production tip (keeps the branch
            # fast-forwardable for cPanel) and main (keeps the lineage visible).
            commit="$(git commit-tree "$tree" -p "$prev" -p HEAD -m "$msg")"
          else
            echo "production does not exist yet; creating it."
            commit="$(git commit-tree "$tree" -p HEAD -m "$msg")"
          fi

          git push origin "$commit:refs/heads/production"
          echo "Pushed $commit to production."

      - name: Summary
        run: |
          {
            echo "### Production branch updated"
            echo ""
            echo "Assets built from \`$(git log -1 --pretty=%h main)\`."
            echo ""
            echo "In cPanel -> Git Version Control -> **Update from Remote**, then **Deploy HEAD Commit**."
          } >> "$GITHUB_STEP_SUMMARY"
